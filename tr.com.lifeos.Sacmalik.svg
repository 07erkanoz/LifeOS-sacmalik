<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1b5e"/>
      <stop offset="0.55" stop-color="#4c2bb0"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e1fb"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#12082e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- zemin -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>

  <!-- arkadaki baloncuk: sağa eğik, yarı saydam -->
  <g transform="rotate(10 168 92)" opacity="0.55">
    <path d="M122 46h82a22 22 0 0 1 22 22v40a22 22 0 0 1-22 22h-8l4 22-26-22h-52a22 22 0 0 1-22-22V68a22 22 0 0 1 22-22z"
          fill="#c4b5fd"/>
  </g>

  <!-- öndeki baloncuk -->
  <g filter="url(#drop)">
    <path d="M62 86h112a26 26 0 0 1 26 26v52a26 26 0 0 1-26 26H112l-38 30 8-30H62a26 26 0 0 1-26-26v-52a26 26 0 0 1 26-26z"
          fill="url(#front)"/>
  </g>

  <!-- üç ses: hepsi aynı anda konuşuyor, biraz dağınık -->
  <circle cx="80"  cy="140" r="15" fill="#4f8cff"/>
  <circle cx="118" cy="130" r="15" fill="#d97757"/>
  <circle cx="156" cy="143" r="15" fill="#10a37f"/>

  <!-- kıvılcım -->
  <path d="M206 168l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#fde68a"/>
  <circle cx="222" cy="150" r="4" fill="#fde68a" opacity="0.8"/>
</svg>
